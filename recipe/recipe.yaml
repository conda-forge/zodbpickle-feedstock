schema_version: 1

context:
  version: "4.5"

package:
  name: zodbpickle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/z/zodbpickle/zodbpickle-${{ version }}.tar.gz
  sha256: 67d4295ddb68b2410fe417094ffe1a8b0ed41834ee308020f58ee1b633e1f751

build:
  number: 2
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - setuptools
    - pip
  run:
    - python
    - setuptools

tests:
  - python:
      imports:
        - zodbpickle
        - zodbpickle.tests
      pip_check: true
  - script:
      - python -m unittest discover -b -v zodbpickle

about:
  license: PSF-2.0 and ZPL-2.0
  license_file: LICENSE.txt
  summary: Fork of Python 3 pickle module.
  homepage: http://pypi.python.org/pypi/zodbpickle
  repository: https://github.com/zopefoundation/zodbpickle

extra:
  recipe-maintainers:
    - jan-janssen
